{% extends "admin/base_site.html" %}

{% block content %}

<h1>Product Views Summary</h1>

<table class="adminlist">
    <thead>
        <tr>
            <th>Product</th>
            <th>Views</th>
        </tr>
    </thead>
    <tbody>
        {% for item in summary_data %}
        <tr>
            <td>
                <a href="/admin/analytics/productview/?product__id__exact={{ item.product__id }}">
                    {{ item.product__name }}
                </a>
            </td>
            <td>{{ item.total_views }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">No data</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
