name: Manufacturing backend checks

on:
  workflow_dispatch:
  push:
    branches: [develop/evibe-platform-redesign]
  pull_request:

jobs:
  django-manufacturing:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Django configuration
        run: python manage.py check
      - name: Generate missing development migrations for test database
        run: python manage.py makemigrations --noinput
      - name: Print migration review summary
        if: always()
        run: |
          echo "Tracked migration changes:"
          git diff --stat -- apps/store/migrations
          echo "New migration files:"
          git ls-files --others --exclude-standard apps/store/migrations
          echo "Migration plan (when generation succeeded):"
          python manage.py showmigrations store || true
      - name: Preserve generated migrations for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manufacturing-migration-review
          path: |
            apps/store/migrations/*.py
            apps/analytics/migrations/*.py
            apps/customer_engagement/migrations/*.py
          retention-days: 14
      - name: Check for uncommitted schema changes
        run: |
          python manage.py makemigrations --check --dry-run --noinput
      - name: Run manufacturing regression tests
        run: |
          python manage.py test \
            apps.store.test_fabric_receipt_validation \
            apps.store.test_cutting_plan_validation \
            apps.store.test_cutting_issue_service \
            apps.store.test_cutting_completion_service \
            apps.store.test_stitching_transfer_service \
            apps.store.test_stitching_receipt_service \
            apps.store.test_production_reconciliation_service \
            apps.store.test_manufacturing_api \
            apps.store.test_manufacturing_dashboard_service \
            --verbosity 2
      - name: Require reviewed and committed migrations
        run: |
          if ! git diff --quiet -- apps/store/migrations; then
            echo "::error::Generated migration changes are not committed."
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard apps/store/migrations)" ]; then
            echo "::error::New migration files generated by CI; commit reviewed migration files before deployment."
            exit 1
          fi
